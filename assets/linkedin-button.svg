<svg width="320" height="82" viewBox="0 0 320 82"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#071217"/>
      <stop offset="100%" stop-color="#0A1A20"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="2.5" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <rect x="2" y="2"
        width="316"
        height="78"
        rx="12"
        fill="url(#bg)"
        stroke="#173B43"
        stroke-width="2"/>

  <rect x="22" y="20"
        width="42"
        height="42"
        rx="8"
        fill="#0A66C2"/>

  <text x="43" y="49"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="22"
        font-weight="700"
        fill="#FFFFFF">
    in
  </text>

  <text x="84" y="39"
        font-family="Arial, sans-serif"
        font-size="17"
        font-weight="700"
        fill="#EDF5F6">
    LinkedIn
  </text>

  <text x="84" y="58"
        font-family="Consolas, monospace"
        font-size="12"
        fill="#7897B0">
    connect with me
  </text>

  <text x="286" y="48"
        text-anchor="middle"
        font-family="Arial, sans-serif"
        font-size="22"
        fill="#19E6DF"
        filter="url(#glow)">
    →
  </text>

</svg>
