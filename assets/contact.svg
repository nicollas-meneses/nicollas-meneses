<svg width="1200" height="260" viewBox="0 0 1200 260"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03080c"/>
      <stop offset="100%" stop-color="#07191d"/>
    </linearGradient>

    <filter id="glow">
      <feGaussianBlur stdDeviation="3" result="blur"/>
      <feMerge>
        <feMergeNode in="blur"/>
        <feMergeNode in="SourceGraphic"/>
      </feMerge>
    </filter>
  </defs>

  <!-- FUNDO -->
  <rect width="1200" height="260" fill="#050b0f"/>

  <!-- CARD PRINCIPAL -->
  <rect x="20" y="20" width="1160" height="220"
        rx="16"
        fill="url(#bg)"
        stroke="#163940"
        stroke-width="2"/>

  <!-- TÍTULO -->
  <text x="48" y="65"
        font-family="Arial, sans-serif"
        font-size="22"
        font-weight="700"
        fill="#edf5f6">
    Connect with me
  </text>

  <text x="950" y="64"
        font-family="Consolas, monospace"
        font-size="13"
        fill="#7897b0">
    // let's connect
  </text>

  <line x1="48" y1="83" x2="1150" y2="83"
        stroke="#15363d"/>

  <!-- LINKEDIN -->
  <rect x="48" y="108" width="210" height="58"
        rx="10"
        fill="#071217"
        stroke="#173b43"/>

  <rect x="72" y="123" width="28" height="28"
        rx="5"
        fill="#0A66C2"/>

  <text x="86" y="143"
        text-anchor="middle"
        font-family="Arial"
        font-size="16"
        font-weight="700"
        fill="#ffffff">
    in
  </text>

  <text x="118" y="143"
        font-family="Arial"
        font-size="15"
        fill="#dce7e9">
    LinkedIn
  </text>

  <!-- GITHUB -->
  <rect x="280" y="108" width="210" height="58"
        rx="10"
        fill="#071217"
        stroke="#173b43"/>

  <circle cx="318" cy="137" r="15"
          fill="#dfe8ea"/>

  <text x="318" y="143"
        text-anchor="middle"
        font-family="Arial"
        font-size="12"
        font-weight="700"
        fill="#071217">
    GH
  </text>

  <text x="350" y="143"
        font-family="Arial"
        font-size="15"
        fill="#dce7e9">
    GitHub
  </text>

  <!-- EMAIL -->
  <rect x="512" y="108" width="210" height="58"
        rx="10"
        fill="#071217"
        stroke="#173b43"/>

  <rect x="537" y="124" width="29" height="22"
        rx="3"
        fill="none"
        stroke="#19e6df"
        stroke-width="2"/>

  <path d="M538 126 L551 137 L565 126"
        fill="none"
        stroke="#19e6df"
        stroke-width="2"/>

  <text x="585" y="143"
        font-family="Arial"
        font-size="15"
        fill="#dce7e9">
    Email
  </text>

  <!-- FRASE -->
  <text x="780" y="128"
        font-family="Consolas, monospace"
        font-size="14"
        fill="#829ca7">
    CODE • LEARN • IMPROVE
  </text>

  <text x="780" y="152"
        font-family="Consolas, monospace"
        font-size="14"
        fill="#19e6df">
    • REPEAT
  </text>

  <!-- RODAPÉ -->
  <line x1="48" y1="194" x2="1150" y2="194"
        stroke="#15363d"/>

  <text x="48" y="219"
        font-family="Consolas, monospace"
        font-size="12"
        fill="#617986">
    Thanks for visiting.
  </text>

  <text x="1000" y="219"
        font-family="Consolas, monospace"
        font-size="12"
        fill="#617986">
    Nicollas Meneses
  </text>

</svg>
