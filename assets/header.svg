  <text x="36" y="48"
        font-family="Consolas, monospace"
        font-size="16"
        font-weight="600"
        fill="#19e6df">
    &gt;_ nicollas@github:~$
  </text>

  <!-- MENU -->
  <text x="760" y="47"
