<svg width="1200" height="470" viewBox="0 0 1200 470"
     xmlns="http://www.w3.org/2000/svg">

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#03080c"/>
      <stop offset="55%" stop-color="#061014"/>
      <stop offset="100%" stop-color="#07191d"/>
